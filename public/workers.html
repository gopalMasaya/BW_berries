<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ניהול משתמשים — Plants Tracker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <div class="container">

        <div class="page-header">
          <h1 class="page-title">ניהול משתמשים</h1>
          <div id="addArea"></div>
        </div>

        <!-- Where a newly created login account reports itself. The temporary
             password only exists here, in this one render: it is never stored,
             so the manager has to copy it out before leaving the page. -->
        <div id="loginNotice" style="display:none;"></div>

        <div class="card">
          <div id="tableWrap"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modal" style="display:none;">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin:0 0 16px;color:var(--text);font-weight:800;"></h3>
      <div class="form-grid" style="grid-template-columns:1fr;">
        <div class="field">
          <label>שם</label>
          <input id="fName" placeholder="שם מלא" />
        </div>
        <div class="field">
          <label>טלפון</label>
          <input id="fPhone" type="tel" placeholder="050-1234567" dir="ltr" />
        </div>
        <div class="field">
          <label>מספר סידורי</label>
          <input id="fSerial" placeholder="לדוגמה: 9555" dir="ltr" />
        </div>
        <div class="field">
          <label>אימייל לכניסה (לא חובה)</label>
          <input id="fEmail" type="email" placeholder="name@example.com" dir="ltr" autocomplete="off" />
          <div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;">
            מאפשר כניסה עם אימייל וסיסמה כשלא מגיע SMS. חשבון הכניסה ייווצר
            אוטומטית בשמירה, והסיסמה הזמנית תוצג כאן.
          </div>
        </div>
        <div class="field">
          <label>תפקיד</label>
          <select id="fRole">
            <option value="worker">עובד</option>
            <option value="contractor">קבלן</option>
            <option value="manager">מנהל</option>
          </select>
        </div>
      </div>
      <div style="color:var(--bad);font-size:14px;min-height:20px;margin-top:8px;" id="modalError"></div>
      <div class="row" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn-primary" id="modalSave">שמור</button>
        <button class="btn" id="modalCancel">ביטול</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "./guard.mjs";
    import { initSidebar } from "./sidebar.mjs";
    import { getAllPhones, registerPhone, updatePhone, deletePhone, phoneKey, normalizePhone, currentUser } from "./auth.mjs";

    const { user, profile } = await requireAuth(["manager"]);
    initSidebar(profile);

    const isManager = profile.role === "manager";
    const roleLabels = { manager: "מנהל", worker: "עובד", contractor: "קבלן" };

    // Show "add" button for managers
    if (isManager) {
      document.getElementById("addArea").innerHTML =
        `<button class="btn-primary" id="addBtn">+ הוסף משתמש</button>`;
      document.getElementById("addBtn").addEventListener("click", () => openModal("add"));
    }

    // ── Login account provisioning ──────────────
    // Saving a user only writes the allowedPhones record. With SMS that's
    // enough — Firebase creates the Auth account when the OTP is verified —
    // but the email + password fallback has nobody to create one, so an
    // address that looks registered here would fail at login as a wrong
    // password. Ask the backend to create the account as part of the save.

    const noticeEl = document.getElementById("loginNotice");

    function showNotice(html, bad = false) {
      noticeEl.style.display = "";
      noticeEl.innerHTML = `
        <div class="card" style="margin-bottom:14px;border-right:4px solid ${bad ? "var(--bad)" : "var(--good,#047857)"};">
          <div style="display:flex;gap:12px;align-items:flex-start;">
            <div style="flex:1;line-height:1.7;">${html}</div>
            <button class="btn" id="noticeClose">סגור</button>
          </div>
        </div>`;
      document.getElementById("noticeClose")
        .addEventListener("click", () => { noticeEl.style.display = "none"; noticeEl.innerHTML = ""; });
      noticeEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    async function ensureLoginAccount(email, name) {
      try {
        const u = currentUser();
        if (!u) return;
        const token = await u.getIdToken();
        const resp = await fetch("/api/ensure-login", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ email, name })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || ("HTTP " + resp.status));

        if (data.existed) {
          showNotice(`חשבון הכניסה של <b dir="ltr">${email}</b> כבר קיים — אפשר להיכנס עם האימייל והסיסמה הקיימים.`);
        } else {
          showNotice(`
            נוצר חשבון כניסה עבור <b dir="ltr">${email}</b>.<br>
            סיסמה זמנית: <code dir="ltr" style="font-size:16px;font-weight:800;background:var(--bg,#f1f5f9);padding:2px 8px;border-radius:6px;">${data.password}</code><br>
            <span style="color:var(--muted);font-size:13px;">העתק אותה עכשיו — היא לא נשמרת ולא תוצג שוב. המשתמש יכול להחליף אותה דרך "שכחתי סיסמה" במסך הכניסה.</span>`);
        }
      } catch (e) {
        console.error("ensure-login failed", e);
        showNotice(`
          המשתמש נשמר, אבל לא הצלחנו ליצור לו חשבון כניסה עם אימייל (${e.message || e}).<br>
          <span style="color:var(--muted);font-size:13px;">עד שזה יסודר, אפשר ליצור אותו ידנית בקונסולת Firebase — Authentication → Add user — עם הכתובת <b dir="ltr">${email}</b>. הכניסה עם SMS עובדת בכל מקרה.</span>`, true);
      }
    }

    // ── Data ────────────────────────────────────

    let workers = [];

    async function loadWorkers() {
      workers = await getAllPhones();
      render();
    }

    function render() {
      const wrap = document.getElementById("tableWrap");

      if (!workers.length) {
        wrap.innerHTML = `<div class="empty-state">אין משתמשים רשומים</div>`;
        return;
      }

      let html = `
        <table class="crm">
          <thead>
            <tr>
              <th>שם</th>
              <th>מס׳ סידורי</th>
              <th>טלפון</th>
              <th>אימייל</th>
              <th>תפקיד</th>
              ${isManager ? "<th>פעולות</th>" : ""}
            </tr>
          </thead>
          <tbody>`;

      for (const w of workers) {
        html += `<tr>
          <td>${esc(w.name)}</td>
          <td dir="ltr" style="text-align:right;">${esc(w.serialNumber || "")}</td>
          <td dir="ltr" style="text-align:right;">${esc(w.phone || "")}</td>
          <td dir="ltr" style="text-align:right;">${w.email ? esc(w.email) : "—"}</td>
          <td>${roleLabels[w.role] || w.role}</td>`;

        if (isManager) {
          html += `<td style="white-space:nowrap;">
            <button class="action-btn" data-key="${w.key}" data-action="edit">עריכה</button>
            <button class="action-btn" data-key="${w.key}" data-action="delete" style="color:var(--bad);">מחיקה</button>
          </td>`;
        }
        html += `</tr>`;
      }

      html += `</tbody></table>`;
      wrap.innerHTML = html;

      // Wire action buttons
      wrap.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.key;
          if (btn.dataset.action === "edit") openModal("edit", key);
          else if (btn.dataset.action === "delete") handleDelete(key);
        });
      });
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // ── Modal ───────────────────────────────────

    const modal      = document.getElementById("modal");
    const modalTitle  = document.getElementById("modalTitle");
    const modalError  = document.getElementById("modalError");
    const fName       = document.getElementById("fName");
    const fPhone      = document.getElementById("fPhone");
    const fSerial     = document.getElementById("fSerial");
    const fEmail      = document.getElementById("fEmail");
    const fRole       = document.getElementById("fRole");

    let editingKey = null;

    function openModal(mode, key) {
      editingKey = key || null;
      modalError.textContent = "";

      if (mode === "add") {
        modalTitle.textContent = "הוספת משתמש";
        fName.value = "";
        fPhone.value = "";
        fSerial.value = "";
        fEmail.value = "";
        fPhone.readOnly = false;
        fRole.value = "worker";
      } else {
        const w = workers.find(x => x.key === key);
        if (!w) return;
        modalTitle.textContent = "עריכת משתמש";
        fName.value = w.name || "";
        fPhone.value = w.phone || "";
        fSerial.value = w.serialNumber || "";
        fEmail.value = w.email || "";
        fPhone.readOnly = true;
        fRole.value = w.role || "worker";
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
      editingKey = null;
    }

    document.getElementById("modalCancel").addEventListener("click", closeModal);

    document.getElementById("modalSave").addEventListener("click", async () => {
      modalError.textContent = "";
      const name  = fName.value.trim();
      const phone = fPhone.value.trim();
      const serialNumber = fSerial.value.trim();
      const email = fEmail.value.trim().toLowerCase();
      const role  = fRole.value;

      if (!name) { modalError.textContent = "נא למלא שם"; return; }
      if (!phone) { modalError.textContent = "נא למלא מספר טלפון"; return; }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        modalError.textContent = "כתובת אימייל לא תקינה";
        return;
      }

      // Validate phone format
      const normalized = normalizePhone(phone);
      if (!/^\+\d{10,15}$/.test(normalized)) {
        modalError.textContent = "מספר טלפון לא תקין";
        return;
      }

      const saveBtn = document.getElementById("modalSave");
      saveBtn.disabled = true;
      saveBtn.textContent = "שומר...";

      try {
        if (editingKey) {
          await updatePhone(editingKey, { name, role, serialNumber, email });
        } else {
          // Check if phone already registered
          const key = phoneKey(phone);
          const existing = workers.find(w => w.key === key);
          if (existing) {
            modalError.textContent = "מספר טלפון כבר רשום במערכת";
            return;
          }
          await registerPhone(phone, { name, role, serialNumber, email });
        }
        closeModal();
        await loadWorkers();
        // After the record exists — the backend refuses to create an account
        // for an address that isn't on an allowedPhones entry.
        if (email) await ensureLoginAccount(email, name);
      } catch (e) {
        modalError.textContent = "שגיאה: " + (e.message || e);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "שמור";
      }
    });

    // ── Delete ──────────────────────────────────

    async function handleDelete(key) {
      const w = workers.find(x => x.key === key);
      if (!w) return;

      // Prevent deleting own phone
      const currentPhone = profile.phone;
      if (currentPhone && phoneKey(currentPhone) === key) {
        alert("לא ניתן למחוק את עצמך");
        return;
      }

      if (!confirm(`למחוק את ${w.name || w.phone}?`)) return;

      try {
        await deletePhone(key);
        await loadWorkers();
      } catch (e) {
        alert("שגיאה במחיקה: " + (e.message || e));
      }
    }

    // ── Init ────────────────────────────────────
    await loadWorkers();
  </script>
</body>
</html>
